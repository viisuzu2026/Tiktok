<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9bShwFNLh4wXWfESwRXhmDS6Fb8H-hj6FWh1tDm7bmDJ_ktTGfOjZ0aaZ9nma7mnk/exec";

    let chartHoursInstance = null;
    let chartAgeInstance = null;
    let chartGenderInstance = null;
    let chartCityInstance = null;

    // HÀM MỚI: Xử lý chuỗi thời gian dài thành chữ "THÁNG X"
    function formatMonthDisplay(rawStr) {
      if (!rawStr) return "THÁNG...";
      // Cắt lấy đúng số tháng trong chuỗi định dạng 2026-04-30T...
      const match = rawStr.match(/^\d{4}-(\d{2})-\d{2}/);
      if (match) {
        return `THÁNG ${parseInt(match[1], 10)}`; // Ví dụ: "04" -> "4"
      }
      return rawStr.toUpperCase();
    }

    async function fetchData(month = "") {
      const loader = document.getElementById('loading');
      loader.classList.remove('hidden');

      try {
        const url = month ? `${SCRIPT_URL}?month=${encodeURIComponent(month)}` : SCRIPT_URL;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          console.error("Lỗi từ server Apps Script:", data.error);
          return;
        }

        // 1. Dropdown tháng
        const selectElem = document.getElementById('select-month');
        if (data.availableMonths && (selectElem.options.length <= 1 || !selectElem.dataset.loaded)) {
          selectElem.innerHTML = data.availableMonths.map(m => `
            <!-- Vẫn giữ value là chuỗi gốc để hệ thống hiểu, nhưng text hiển thị đã được format gọn lại -->
            <option value="${m}" ${m === data.currentMonth ? 'selected' : ''} class="text-slate-900">${formatMonthDisplay(m)}</option>
          `).join('');
          selectElem.dataset.loaded = "true";
        } else if (data.currentMonth) {
          selectElem.value = data.currentMonth;
        }

        // 2. Cập nhật Title: ITB (đỏ) - HIỆU QUẢ TIKTOK ORGANIC - THÁNG X (đỏ)
        const rawMonth = data.currentMonth || selectElem.value || "THÁNG...";
        const displayMonth = formatMonthDisplay(rawMonth); // Dùng hàm format để làm gọn chữ
        document.getElementById('txt-title').innerHTML = `
          <span class="text-red-400">ITB</span> - HIỆU QUẢ TIKTOK ORGANIC - <span class="text-red-400">${displayMonth}</span>
        `;

        // 3. 6 Thẻ KPI
        document.getElementById('kpi-views').innerText = data.kpis.views || 0;
        document.getElementById('kpi-views-diff').innerText = data.kpis.views_diff || "";
        document.getElementById('kpi-engagements').innerText = data.kpis.engagements || 0;
        document.getElementById('kpi-engagements-diff').innerText = data.kpis.engagements_diff || "";
        document.getElementById('kpi-er').innerText = data.kpis.er || "0.00%";
        document.getElementById('kpi-er-diff').innerText = data.kpis.er_diff || "";
        document.getElementById('kpi-profile-views').innerText = data.kpis.profile_views || 0;
        document.getElementById('kpi-profile-views-diff').innerText = data.kpis.profile_views_diff || "";
        document.getElementById('kpi-leads').innerText = data.kpis.leads || 0;
        document.getElementById('kpi-leads-diff').innerText = data.kpis.leads_diff || "";
        document.getElementById('kpi-total-videos').innerText = data.kpis.total_videos || 0;

        // 4. Hai chủ đề nổi bật
        document.getElementById('txt-top-view-topic').innerText = data.highlights.top_view_topic || "--";
        document.getElementById('txt-top-view-desc').innerText = `Chiếm ${data.highlights.top_view_share || '0%'} tổng view (${data.highlights.top_view_count || 0} views)`;
        document.getElementById('txt-top-post-topic').innerText = data.highlights.top_post_topic || "--";
        document.getElementById('txt-top-post-desc').innerText = `Đã xuất bản ${data.highlights.top_post_count || 0} video trong tháng`;

        // 5. Bảng Phân loại nội dung
        const catBody = document.getElementById('tbl-categories');
        if (data.contentCategories && data.contentCategories.length > 0) {
          catBody.innerHTML = data.contentCategories.map(r => `
            <tr class="hover:bg-slate-50 transition">
              <td class="py-2 font-bold">${r.category}</td>
              <td class="py-2 text-center">${r.videos}</td>
              <td class="py-2 text-right font-medium">${r.views}</td>
              <td class="py-2 text-right">${r.engagements}</td>
              <td class="py-2 text-right font-semibold text-slate-700">${r.er}</td>
            </tr>
          `).join('');
        } else {
          catBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Không có dữ liệu</td></tr>`;
        }

        // 6. Bảng Top 5 Video Cao Nhất
        const topBody = document.getElementById('tbl-top-videos');
        if (data.topVideos && data.topVideos.length > 0) {
          topBody.innerHTML = data.topVideos.map(v => `
            <tr class="hover:bg-slate-50 transition">
              <td class="py-2 font-bold text-amber-600">#${v.rank}</td>
              <td class="py-2 max-w-[200px] truncate" title="${v.title}">${v.title}</td>
              <td class="py-2 text-right font-bold text-slate-800">${v.views}</td>
              <td class="py-2 text-right font-semibold text-slate-700">${v.er}</td>
              <td class="py-2 text-center">
                <a href="${v.link || '#'}" target="_blank" class="text-red-600 hover:text-red-800 font-bold"><i class="fa-brands fa-tiktok"></i></a>
              </td>
            </tr>
          `).join('');
        } else {
          topBody.innerHTML = `<tr><td colspan="5" class="py-3 text-center text-slate-400">Không có video trong tháng này</td></tr>`;
        }

        // 7. Bảng Top 3 Video Kém Hiệu Quả Nhất
        const bottomBody = document.getElementById('tbl-bottom-videos');
        if (data.bottomVideos && data.bottomVideos.length > 0) {
          bottomBody.innerHTML = data.bottomVideos.map(v => `
            <tr class="hover:bg-rose-50/40 transition">
              <td class="py-2 font-bold text-rose-600">#${v.rank}</td>
              <td class="py-2 max-w-[200px] truncate text-slate-700" title="${v.title}">${v.title}</td>
              <td class="py-2 text-right font-bold text-rose-700">${v.views}</td>
              <td class="py-2 text-right font-semibold text-slate-600">${v.er}</td>
              <td class="py-2 text-center">
                <a href="${v.link || '#'}" target="_blank" class="text-rose-500 hover:text-rose-700 font-bold"><i class="fa-brands fa-tiktok"></i></a>
              </td>
            </tr>
          `).join('');
        } else {
          bottomBody.innerHTML = `<tr><td colspan="5" class="py-3 text-center text-slate-400">Không có dữ liệu video</td></tr>`;
        }

        // 8. Nhận xét tự động
        document.getElementById('txt-auto-comment').innerText = data.autoComment || "Chưa có nhận xét cho tháng này.";

        // 9. Vẽ lại toàn bộ biểu đồ
        renderCharts(data);

      } catch (err) {
        console.error("Lỗi fetch dữ liệu:", err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderCharts(data) {
      if (chartHoursInstance) chartHoursInstance.destroy();
      chartHoursInstance = new Chart(document.getElementById('chartHours'), {
        type: 'line',
        data: {
          labels: data.hourlyChart.labels,
          datasets: [{
            label: 'Lượt hoạt động TB',
            data: data.hourlyChart.data,
            borderColor: '#dc2626',
            backgroundColor: 'rgba(220, 38, 38, 0.1)',
            fill: true,
            tension: 0.35,
            pointRadius: 3,
            pointBackgroundColor: '#dc2626'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { border: { dash: [4, 4] } }
          }
        }
      });

      if (chartAgeInstance) chartAgeInstance.destroy();
      chartAgeInstance = new Chart(document.getElementById('chartAge'), {
        type: 'doughnut',
        data: {
          labels: data.ageChart.labels,
          datasets: [{
            data: data.ageChart.data,
            backgroundColor: ['#f87171', '#dc2626', '#b91c1c', '#991b1b', '#cbd5e1']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });

      if (chartGenderInstance) chartGenderInstance.destroy();
      chartGenderInstance = new Chart(document.getElementById('chartGender'), {
        type: 'pie',
        data: {
          labels: data.genderChart.labels,
          datasets: [{
            data: data.genderChart.data,
            backgroundColor: ['#2563eb', '#ec4899', '#94a3b8']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });

      if (chartCityInstance) chartCityInstance.destroy();
      chartCityInstance = new Chart(document.getElementById('chartCity'), {
        type: 'doughnut',
        data: {
          labels: data.cityChart.labels,
          datasets: [{
            data: data.cityChart.data,
            backgroundColor: ['#dc2626', '#f59e0b', '#10b981', '#6366f1', '#8b5cf6', '#94a3b8']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });
    }

    function downloadPDF() {
      const element = document.getElementById('dashboard-content');
      
      // Lấy tên tháng gọn gàng cho tên file
      const rawMonth = document.getElementById('select-month').value;
      const safeMonthName = formatMonthDisplay(rawMonth).replace(' ', '_') || "Bao_Cao";
      
      const opt = {
        margin:       0.2,
        filename:     `ITB_Tiktok_${safeMonthName}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#f1f5f9' },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    window.addEventListener('DOMContentLoaded', () => fetchData());
  </script>
